<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>리본</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; background: #0e0b16; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .overlay { position: fixed; z-index: 10; font-size: 14px; }
      #hud { left: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; }
      .chip { background: rgba(0,0,0,.55); border: 1px solid #444; border-radius: 8px; padding: 6px 10px; }
      .chip.active { border-color: #ffd54a; }
      #caption { left: 50%; bottom: 6vh; transform: translateX(-50%); max-width: 80vw; font-size: clamp(18px, 3vw, 34px); text-align: center; background: rgba(0,0,0,.6); border-radius: 12px; padding: 12px 20px; display: none; }
      #bubble { left: 0; top: 0; display: none; font-size: clamp(28px, 4vw, 56px); background: #fff; border-radius: 999px; padding: 4px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none; }
      #bubble.thinking { animation: bob 1.2s ease-in-out infinite; }
      @keyframes bob { 50% { margin-top: -8px; } }
      /* 정면 유리 (tv/glass.ts) */
      #glass { position: absolute; pointer-events: none; overflow: hidden; border-radius: 1.6vmin; --g: 0.6; }
      /* 가장자리 빛 + 위쪽 반사 + 모서리 광택 */
      #glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
        box-shadow:
          inset 0 0 0 calc(1px + var(--g) * 2px) rgba(255,255,255,calc(var(--g) * .7)),
          inset 0 0 calc(var(--g) * 3vmin) rgba(255,255,255,calc(var(--g) * .75)),
          inset 0 0 calc(var(--g) * 12vmin) rgba(170,210,255,calc(var(--g) * .45));
        background:
          radial-gradient(60% 45% at 12% 0%, rgba(255,255,255,calc(var(--g) * .45)), rgba(255,255,255,0) 70%),
          linear-gradient(180deg, rgba(255,255,255,calc(var(--g) * .18)) 0%, rgba(255,255,255,0) 12%),
          linear-gradient(118deg,
            rgba(255,255,255,0) 6%, rgba(255,255,255,calc(var(--g) * .28)) 11%, rgba(255,255,255,calc(var(--g) * .1)) 19%, rgba(255,255,255,0) 22%,
            rgba(255,255,255,0) 25%, rgba(255,255,255,calc(var(--g) * .18)) 27%, rgba(255,255,255,0) 30%,
            rgba(255,255,255,0) 68%, rgba(255,255,255,calc(var(--g) * .12)) 74%, rgba(255,255,255,0) 80%),
          radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 65%, rgba(20,35,60,calc(var(--g) * .22)) 100%); }
      /* 천천히 지나가는 광택 */
      #glass::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 22%; left: -40%;
        background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,calc(var(--g) * .32)) 45%, rgba(255,255,255,calc(var(--g) * .32)) 55%, rgba(255,255,255,0));
        filter: blur(6px); transform: skewX(-18deg); animation: glass-sheen 12s ease-in-out infinite; }
      @keyframes glass-sheen { 0%, 65% { left: -40%; } 100% { left: 140%; } }
      /* 마이크 (audio/micControl.ts) */
      .mic-control { display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,.6); border: 1px solid #444; border-radius: 12px; padding: 12px; }
      .mic-control label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #aaa; }
      .mic-control select, .mic-control button { padding: 7px; background: #1b1626; color: #eee; border: 1px solid #555; border-radius: 6px; font-size: 14px; }
      .mic-control button { cursor: pointer; background: #ffd54a; color: #222; border-color: #ffd54a; font-weight: 600; }
      .mic-state { color: #f88; font-size: 13px; }
      .mic-state.on { color: #8f8; }
      .mic-vu { display: flex; gap: 6px; height: 56px; align-items: flex-end; font-size: 10px; color: #aaa; text-align: center; }
      .mic-vu > div { flex: 1; }
      .mic-vu .bar { height: 40px; background: #222; border-radius: 3px; position: relative; overflow: hidden; }
      .mic-vu i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #4aa3ff; }
      .mic-msg { color: #ffd54a; font-size: 13px; min-height: 1em; }
      .mic-control.compact.running label { display: none; }
      #mic-page { position: fixed; inset: 0; overflow: auto; padding: 24px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      #mic-page h1 { margin: 0; }
      #mic-page .hint { color: #999; font-size: 13px; }
      .mic-status { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
      #debug { right: 16px; top: 16px; width: 320px; background: rgba(0,0,0,.75); border: 1px solid #555; border-radius: 10px; padding: 12px; display: none; }
      #debug label { display: block; margin: 6px 0 2px; color: #aaa; font-size: 12px; }
      #debug input, #debug select, #debug button { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 6px; background: #1b1626; color: #eee; border: 1px solid #555; border-radius: 6px; }
      #debug button { cursor: pointer; }
      #debug .log { max-height: 200px; overflow: auto; font-size: 11px; color: #bbb; white-space: pre-wrap; }
      #mode { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #mode video { width: min(90vw, 480px); border-radius: 12px; }
      /* 관리자 페이지 */
      #admin { position: fixed; inset: 0; overflow: auto; padding: 20px 24px 60px; box-sizing: border-box; }
      #admin h1 { margin: 0 0 16px; font-size: 22px; }
      #admin h2 { margin: 0 0 12px; font-size: 17px; color: #ffd54a; }
      #admin .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
      #admin .card { background: #1b1626; border: 1px solid #3a2f4f; border-radius: 14px; padding: 16px 18px; }
      #admin .kid-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
      #admin ul#kid-list { list-style: none; margin: 0; padding: 0; min-width: 150px; }
      #admin ul#kid-list li { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
      #admin ul#kid-list li:hover { background: #2a2238; }
      #admin ul#kid-list li.sel { border-color: #ffd54a; background: #2a2238; }
      #admin .preview canvas { border-radius: 10px; border: 1px solid #3a2f4f; }
      #admin form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; flex: 1; min-width: 260px; }
      #admin form[hidden] { display: none; }
      #admin label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #bbb; }
      #admin input, #admin select, #admin textarea { padding: 7px 9px; background: #0e0b16; color: #eee; border: 1px solid #555; border-radius: 6px; font-size: 14px; }
      #admin input[type=color] { padding: 2px; height: 34px; width: 60px; }
      #admin input[type=range] { padding: 0; }
      #admin .colors { display: flex; gap: 12px; flex-wrap: wrap; }
      #admin .actions { display: flex; gap: 8px; margin-top: 6px; }
      #admin button { padding: 8px 14px; border-radius: 8px; border: 1px solid #666; background: #2a2238; color: #eee; cursor: pointer; font-size: 14px; }
      #admin button[type=submit] { background: #ffd54a; color: #222; border-color: #ffd54a; font-weight: 600; }
      #admin button.danger { border-color: #c0392b; color: #f5a1a1; }
      #admin .msg { margin-top: 16px; min-height: 1.2em; }
      #admin label.inline { flex-direction: row; align-items: center; gap: 6px; }
      #admin label.inline input { width: auto; }
      #admin fieldset { border: 1px solid #3a2f4f; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
      #admin a.button { display: inline-block; padding: 8px 14px; border-radius: 8px; background: #ffd54a; color: #222; font-weight: 600; text-decoration: none; }
      #admin .hint { color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="overlay"></div>
    <div id="caption" class="overlay"></div>
    <div id="bubble" class="overlay"></div>
    <div id="debug" class="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
