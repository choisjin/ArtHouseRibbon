<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0b16" />
    <title>리본</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 폰에서 "홈 화면에 추가" 로 열면 주소창 없이 뜬다 (아이폰은 이 두 줄로) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { margin: 0; padding: 0; background: #0e0b16; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .overlay { position: fixed; z-index: 10; font-size: 14px; }
      #hud { left: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; }
      .chip { background: rgba(0,0,0,.55); border: 1px solid #444; border-radius: 8px; padding: 6px 10px; }
      .chip.active { border-color: #ffd54a; }
      #caption { left: 50%; bottom: 6vh; transform: translateX(-50%); max-width: 80vw; font-size: clamp(18px, 3vw, 34px); text-align: center; background: rgba(0,0,0,.6); border-radius: 12px; padding: 12px 20px; display: none; }
      #bubble { left: 0; top: 0; display: none; font-size: clamp(28px, 4vw, 56px); background: #fff; border-radius: 999px; padding: 4px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none; }
      #bubble.thinking { animation: bob 1.2s ease-in-out infinite; }
      /* 리본이 부르기 (src/tv/callbutton.ts): 오른쪽 기둥에 붙은 전등 스위치처럼.
         위치는 교실 배경 렌더(16:9) 기준으로 맞췄다 */
      #call-btn { right: 5.8%; top: 49%; z-index: 35; display: flex; flex-direction: column; align-items: center; gap: .6vh;
        background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #call-btn .sw-plate { width: clamp(34px, 3.1vw, 62px); aspect-ratio: 3 / 5; border-radius: 12%/7%;
        background: linear-gradient(150deg, #fdfbf7, #e8e2d8 60%, #d8d1c6);
        box-shadow: 0 .5vh 1.2vh rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.7);
        display: grid; place-items: center; transition: transform .12s; }
      #call-btn .sw-rocker { width: 62%; height: 70%; border-radius: 10%/6%; position: relative;
        background: linear-gradient(#fffdf9 0 46%, #efe9df 46% 100%);
        box-shadow: inset 0 .25vh .5vh rgba(0,0,0,.18), 0 .1vh .2vh rgba(255,255,255,.8);
        transition: background .15s; }
      #call-btn .sw-led { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
        width: 22%; aspect-ratio: 1; border-radius: 50%; background: #cfc7bb; transition: background .2s, box-shadow .2s; }
      /* 말을 받는 동안 불이 켜진다 */
      #call-btn.listening .sw-led { background: #ff5a5a; box-shadow: 0 0 .8vh .2vh rgba(255,90,90,.8); }
      #call-btn.pressed .sw-plate { transform: scale(.96); }
      #call-btn.pressed .sw-rocker { background: linear-gradient(#efe9df 0 54%, #fffdf9 54% 100%); }
      #call-btn .sw-label { font-size: clamp(10px, 1vw, 15px); color: rgba(255,255,255,.75); font-weight: 600;
        letter-spacing: .02em; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
      /* 화면 가득 보기 단추 (전체화면이 아닐 때만, src/tv/immersive.ts) */
      #fullscreen-btn { right: 2vw; bottom: 2vh; z-index: 40; font: inherit; font-size: 14px; color: #eee;
        background: rgba(14,11,22,.7); border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
        padding: 8px 14px; cursor: pointer; }
      #fullscreen-btn[hidden] { display: none; }
      /* "플레이리스트 보여줘" 번호 목록 (src/tv/musiclist.ts). 번호를 크게: 글 못 읽는 아이도 번호를 말할 수 있게 */
      #music-list { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(62vw, 820px); display: none;
        flex-direction: column; gap: 1vh; padding: 2.2vh 2vw; background: rgba(14,11,22,.9); border-radius: 26px;
        border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 50px rgba(0,0,0,.5); z-index: 20; }
      #music-list.on { display: flex; }
      #music-list .ml-head { font-size: clamp(18px, 2.4vw, 32px); font-weight: 800; color: #1db954; }
      #music-list .ml-head small { color: #bbb; font-weight: 500; font-size: clamp(12px, 1.4vw, 18px); }
      #music-list .ml-row { display: flex; align-items: center; gap: 1.2vw; }
      #music-list .ml-n { flex: none; width: 2.2em; text-align: center; font-size: clamp(22px, 3vw, 44px); color: #ffd54a; }
      #music-list img, #music-list .ml-art { flex: none; width: 6vh; height: 6vh; border-radius: 10px; background: #333; object-fit: cover; }
      #music-list .ml-text { min-width: 0; display: flex; flex-direction: column; }
      #music-list .ml-text b, #music-list .ml-text span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #music-list .ml-text b { font-size: clamp(16px, 2vw, 28px); }
      #music-list .ml-text span { font-size: clamp(12px, 1.4vw, 18px); color: #bbb; }
      #music-list .ml-foot { font-size: clamp(13px, 1.5vw, 20px); color: #bbb; margin-top: .6vh; }
      /* 음악 상태바 (src/tv/musicbar.ts). 떠 있으면 자막을 그 위로 */
      #music-bar { left: 50%; bottom: 2.4vh; transform: translateX(-50%); width: min(72vw, 980px); display: none; align-items: center;
        gap: 1.4vw; padding: 1.2vh 1.4vw; background: rgba(14,11,22,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index: 12; }
      #music-bar.on { display: flex; }
      #music-bar img { width: 8vh; height: 8vh; border-radius: 12px; object-fit: cover; flex: none; }
      #music-bar .mb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .5vh; }
      #music-bar b, #music-bar .mb-text span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #music-bar b { font-size: clamp(16px, 2.2vw, 30px); }
      #music-bar .mb-text span { font-size: clamp(13px, 1.5vw, 20px); color: #bbb; }
      #music-bar .mb-prog { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
      #music-bar .mb-prog i { display: block; height: 100%; width: 0; background: #1db954; transition: width .5s linear; }
      #music-bar .mb-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: .4vh;
        font-size: clamp(11px, 1.2vw, 16px); color: #ddd; max-width: 26%; }
      #music-bar .mb-src { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: #1db954; font-weight: 700; }
      #music-bar .mb-modes { display: flex; gap: .8vw; white-space: nowrap; }
      #music-bar .mb-modes .off { color: #777; }
      #music-bar .mb-icon { flex: none; font-size: clamp(20px, 2.6vw, 36px); color: #1db954; width: 3vw; text-align: center; }
      #music-bar.paused { opacity: .75; }
      #music-bar.paused .mb-icon { color: #bbb; }
      body.music-on #caption { bottom: calc(2.4vh + 8vh + 4.4vh); }
      /* 말을 받을 수 있을 때만 오른쪽 위 마이크 (서버 mic 메시지) */
      #mic-badge { right: 2.4vw; top: 2.4vh; width: 7vw; height: 7vw; max-width: 110px; max-height: 110px; border-radius: 50%;
        background: #e03131; display: none; place-items: center; z-index: 30;
        box-shadow: 0 0 0 0 rgba(224,49,49,.6); animation: micpulse 1.2s ease-out infinite; }
      #mic-badge.on { display: grid; }
      #mic-badge svg { width: 55%; height: 55%; fill: #fff; stroke: #fff; }
      @keyframes micpulse { to { box-shadow: 0 0 0 2.2vw rgba(224,49,49,0); } }
      /* 포켓몬 맞추기 (src/tv/game.ts) */
      #game { left: 4vw; top: 4vh; max-height: 74vh; display: none; flex-direction: column; align-items: center; gap: 1.6vh;
        background: rgba(255,255,255,.94); color: #222; border-radius: 28px; padding: 2.4vh 2.4vw; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
      #game .g-title { font-size: clamp(18px, 2.6vw, 34px); font-weight: 800; color: #d6336c; }
      #game .g-card { position: relative; width: min(42vh, 32vw); aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #f3f0f7; }
      #game .g-card img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; }
      #game .g-card.noimg img { display: none; }
      #game .g-q { position: absolute; inset: 0; display: none; place-items: center; font-size: min(26vh, 18vw); font-weight: 900; color: #c9bfe0; }
      #game .g-card.noimg .g-q { display: grid; }
      #game .g-card.solved { box-shadow: 0 0 0 6px #ffd43b; }
      #game .g-mask { position: absolute; inset: 0; display: grid; }
      #game .g-mask div { background: #5f3dc4; border: 1px solid #7048e8; transition: opacity .6s; }
      #game .g-mask div.open { opacity: 0; }
      #game .g-types span { display: inline-block; margin: 0 .4vw; padding: .3vh 1.2vw; border-radius: 999px; background: #e7f5ff; font-size: clamp(16px, 2vw, 28px); font-weight: 700; }
      #game .g-board { display: flex; gap: .8vw; }
      #game .g-board span { min-width: 1.3em; padding: .1em .15em; text-align: center; border-bottom: 5px solid #adb5bd; font-size: clamp(22px, 3.2vw, 46px); font-weight: 900; }
      #game .g-board span.cho { color: #1c7ed6; }
      #game-menu { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
        background: radial-gradient(circle at 50% 30%, #ffec99, #ff914d 55%, #d6336c); }
      #game-menu .gm-title { font-size: clamp(32px, 6vw, 88px); font-weight: 900; color: #fff; letter-spacing: .05em;
        text-shadow: 0 6px 0 #c2255c, 0 10px 24px rgba(0,0,0,.35); }
      #game-menu .gm-cards { display: flex; gap: 3.5vw; align-items: flex-start; }
      #game-menu .gm-card { position: relative; width: 23vw; text-align: center; transition: transform .35s, opacity .35s, filter .35s; }
      /* 게임 박스 표지 (3:4) */
      #game-menu .gm-cover { position: relative; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; border: .45vw solid #fff;
        box-shadow: 0 1.2vw 2.4vw rgba(0,0,0,.35); transition: box-shadow .35s; }
      #game-menu .gm-describe { background: radial-gradient(circle at 50% 38%, #fff3bf, #ffa94d 58%, #d9480f); }
      #game-menu .gm-image { background: radial-gradient(circle at 50% 38%, #e7f5ff, #74c0fc 55%, #364fc7); }
      #game-menu .gm-peek { background: radial-gradient(circle at 50% 38%, #f3f0ff, #9775fa 55%, #5f3dc4); }
      #game-menu .gm-rays { position: absolute; inset: -50%; animation: spin 40s linear infinite;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.2) 0 9deg, transparent 9deg 18deg); }
      @keyframes spin { to { transform: rotate(360deg); } }
      #game-menu .gm-full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #game-menu .gm-art { position: absolute; left: 10%; top: 9%; width: 80%; height: 60%; object-fit: contain;
        filter: drop-shadow(0 .6vw 0 rgba(0,0,0,.28)); }
      #game-menu .gm-bubble { position: absolute; right: 5%; top: 5%; width: 32%; aspect-ratio: 1; border-radius: 50%; background: #fff;
        display: grid; place-items: center; font-size: 4.6vw; font-weight: 900; color: #e8590c; box-shadow: 0 .4vw 0 rgba(0,0,0,.2); }
      #game-menu .gm-bubble::after { content: ""; position: absolute; left: 8%; bottom: -8%; border: 1vw solid transparent;
        border-top-color: #fff; border-right-color: #fff; transform: rotate(20deg); }
      #game-menu .gm-frame { position: absolute; left: 7%; top: 6%; width: 86%; height: 66%; border: .9vw solid #fcc419; border-radius: 10px;
        box-shadow: inset 0 0 0 .3vw #e67700, 0 0 0 .3vw #e67700; }
      #game-menu .gm-tiles { position: absolute; left: 10%; top: 9%; width: 80%; height: 60%; display: grid;
        grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); }
      #game-menu .gm-tiles i { background: #5f3dc4; border: 1px solid #7950f2; }
      #game-menu .gm-tiles i.open { background: transparent; border-color: transparent; }
      #game-menu .gm-logo { position: absolute; left: 0; right: 0; bottom: 5%; line-height: 1.05; }
      #game-menu .gm-logo small, #game-menu .gm-logo b { display: block; font-weight: 900; paint-order: stroke fill; }
      #game-menu .gm-logo small { font-size: 1.7vw; color: #ffd43b; -webkit-text-stroke: .35vw #1c1c1c; letter-spacing: .1em; }
      #game-menu .gm-logo b { font-size: 2.7vw; color: #fff; -webkit-text-stroke: .45vw #c2255c; text-shadow: 0 .45vw 0 #1c1c1c; }
      #game-menu .gm-image .gm-logo b { -webkit-text-stroke-color: #364fc7; }
      #game-menu .gm-peek .gm-logo b { -webkit-text-stroke-color: #5f3dc4; }
      #game-menu .gm-num { position: absolute; top: -1.8vw; left: -1.4vw; width: 4.6vw; height: 4.6vw; border-radius: 50%; background: #d6336c;
        color: #fff; border: .35vw solid #fff; display: grid; place-items: center; font-size: 2.6vw; font-weight: 900; box-shadow: 0 .4vw 1vw rgba(0,0,0,.3); }
      #game-menu .gm-sub { margin-top: 1.4vh; font-size: clamp(13px, 1.4vw, 22px); font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
      #game-menu.picked .gm-card { opacity: .4; filter: grayscale(.7); transform: scale(.92); }
      #game-menu.picked .gm-card.on { opacity: 1; filter: none; transform: scale(1.1); }
      #game-menu.picked .gm-card.on .gm-cover { animation: glow 1s ease-in-out infinite alternate; }
      @keyframes glow { from { box-shadow: 0 0 0 6px #ffd43b, 0 10px 30px rgba(0,0,0,.3); } to { box-shadow: 0 0 0 12px #fff3bf, 0 0 60px 10px #ffd43b; } }
      #game-menu .gm-hint { font-size: clamp(20px, 3vw, 44px); font-weight: 800; color: #fff; text-shadow: 0 3px 8px rgba(0,0,0,.35); }
      #game .g-types:empty, #game .g-board:empty, #game .g-answer:empty { display: none; }
      #game .g-answer { font-size: clamp(22px, 3.4vw, 48px); font-weight: 900; color: #d6336c; min-height: 1em; }
      @keyframes bob { 50% { margin-top: -8px; } }
      #debug { right: 16px; top: 16px; width: 320px; background: rgba(0,0,0,.75); border: 1px solid #555; border-radius: 10px; padding: 12px; display: none; }
      #debug label { display: block; margin: 6px 0 2px; color: #aaa; font-size: 12px; }
      #debug input, #debug select, #debug button { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 6px; background: #1b1626; color: #eee; border: 1px solid #555; border-radius: 6px; }
      #debug button { cursor: pointer; }
      #debug .log { max-height: 200px; overflow: auto; font-size: 11px; color: #bbb; white-space: pre-wrap; }
      #mode { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #mode video { width: min(90vw, 480px); border-radius: 12px; }
      /* 관리자 페이지 스타일은 src/admin/style.css */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="overlay"></div>
    <div id="caption" class="overlay"></div>
    <div id="bubble" class="overlay"></div>
    <div id="mic-badge" class="overlay" aria-label="말해도 돼요"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8" fill="none" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div id="debug" class="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
